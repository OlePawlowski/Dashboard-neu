version: '3.9'
services:
  dashboard:
    build: .
    container_name: helpcare-dashboard
    env_file:
      - .env
    environment:
      - APP_DATA_DIR=/data
      # Optional: DATABASE_URL for Postgres, sonst SQLite in /data/app.db
      # - DATABASE_URL=postgresql://user:pass@host:5432/dbname
      # Optional: GOOGLE OAuth etc.
      # - GOOGLE_CLIENT_CONFIG_JSON=...
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./data:/data:delegated
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/', timeout=3) else sys.exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: bash -lc "exec gunicorn app:app -b 0.0.0.0:${PORT:-8000} --timeout 120"
